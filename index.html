<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b5522b">
<meta name="description" content="Livre de recettes personnel (air fryer et cuisine traditionnelle)">
<title>Livre de recettes</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="bar">
    <h1 id="title">Livre de recettes</h1>
    <span class="net" id="net" hidden>hors ligne</span>
    <button class="btn icon" id="btnReload" title="Recharger depuis le Google Sheet" aria-label="Recharger">↻</button>
    <button class="btn icon" id="btnSettings" title="Réglages" aria-label="Réglages">⚙</button>
    <button class="btn" id="btnBook">Livre</button>
    <button class="btn primary" id="btnNew">+ Recette</button>
  </div>
  <div class="filters" id="filters">
    <input class="search" id="q" type="search" placeholder="Rechercher une recette, un ingrédient…">
    <div class="chips" id="chips"></div>
    <div class="selects">
      <select id="fMode"><option value="">Tous les modes de cuisson</option></select>
      <select id="fStatut"><option value="">Tous les statuts</option></select>
    </div>
  </div>
</header>

<main class="wrap" id="app"><div class="msg">Chargement…</div></main>
<div class="toast" id="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
