<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b5522b">
<meta name="description" content="Livre de recettes partagé (air fryer et cuisine traditionnelle)">
<title>Livre de recettes</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Recettes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="bar">
    <div class="brand"><img src="icons/icon-192.png" alt=""><h1>Livre de recettes <small id="ver" class="ver"></small></h1></div>
    <span class="net" id="net" hidden>hors ligne</span>
    <button class="btn sync" id="btnSync" hidden>⬆ 0</button>
    <button class="btn icon" id="btnReload" title="Recharger" aria-label="Recharger" hidden>↻</button>
    <button class="btn" id="btnBook" title="Livre / impression PDF" aria-label="Livre / impression PDF" hidden>📖 Livre</button>
    <button class="btn primary" id="btnNew" hidden>+ Recette</button>
    <button class="avatar" id="btnMe" title="Mon compte" aria-label="Mon compte" hidden>?</button>
  </div>
  <div class="filters" id="filters" style="display:none">
    <input class="search" id="q" type="search" placeholder="Rechercher une recette, un ingrédient…">
    <div class="chips" id="chips"></div>
    <div class="chips authors" id="authors"></div>
    <div class="selects">
      <select id="fMode"><option value="">Tous les modes de cuisson</option></select>
      <select id="fStatut"><option value="">Tous les statuts</option></select>
    </div>
  </div>
</header>

<div class="install no-print" id="install" hidden></div>
<main class="wrap" id="app"><div class="msg">Chargement…</div></main>
<div class="toast" id="toast" hidden></div>
<div class="busy" id="busy" hidden><div id="busyTxt">Enregistrement…</div></div>

<div class="splash" id="splash" hidden>
  <video id="splashVid" muted playsinline webkit-playsinline preload="auto" poster="media/accueil.jpg"><source src="media/accueil.mp4" type="video/mp4"></video>
  <div class="splash-txt"><span class="s1">Le livre de recettes</span><span class="s2">de la famille Dudu</span></div>
  <div class="splash-tap">Toucher pour entrer</div>
</div>
<script src="app.js"></script>
</body>
</html>
